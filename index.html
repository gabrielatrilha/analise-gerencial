<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>MAGNUM IMPORT — Dashboard Gerencial</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b1222;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;font-size:14px}
.d{max-width:1200px;margin:0 auto;padding:24px}
.hdr{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.hdr h1{font-size:20px;font-weight:700;letter-spacing:.5px;flex:1}
.hdr .dt{font-size:12px;opacity:.6}
.tabs{display:flex;gap:4px;margin-bottom:20px;flex-wrap:wrap}
.tb{padding:7px 16px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:#94a3b8;user-select:none;transition:all .15s}
.tb:hover{background:rgba(255,255,255,.12);color:#e2e8f0}
.tb.a{background:#1d4ed8;border-color:#2563eb;color:#fff}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:20px}
.kp{padding:16px;border-radius:10px}
.kp .lb{font-size:10px;text-transform:uppercase;letter-spacing:1px;opacity:.85;margin-bottom:5px}
.kp .vl{font-size:20px;font-weight:700}
.kp .sb{font-size:10px;opacity:.65;margin-top:5px}
.k1{background:linear-gradient(135deg,#1e3a8a,#2563eb)}
.k2{background:linear-gradient(135deg,#7f1d1d,#dc2626)}
.k3{background:linear-gradient(135deg,#14532d,#16a34a)}
.k4{background:linear-gradient(135deg,#78350f,#d97706)}
.k5{background:linear-gradient(135deg,#3b0764,#7c3aed)}
.k6{background:linear-gradient(135deg,#064e3b,#059669)}
.sec{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:18px}
.st{font-size:15px;font-weight:700;margin-bottom:12px;color:#f1f5f9}
.cr{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.cb{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:16px}
.cb h3{font-size:13px;font-weight:600;margin-bottom:12px}
.bar-chart{display:flex;align-items:flex-end;gap:2px;height:180px;padding-top:10px}
.bar-group{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.bar-stack{display:flex;align-items:flex-end;gap:1px;height:160px}
.bar{min-width:12px;border-radius:2px 2px 0 0;position:relative}
.bar .bt{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:8px;white-space:nowrap;opacity:.8}
.bar-label{font-size:9px;opacity:.6;margin-top:4px;text-align:center}
.line-chart{position:relative;height:180px;border-left:1px solid rgba(255,255,255,.1);border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:20px}
.line-row{display:flex;align-items:flex-end;height:160px;padding:0 4px;gap:2px;position:relative}
.line-labels{display:flex;gap:2px;padding:0 4px}
.line-labels span{flex:1;text-align:center;font-size:9px;opacity:.5}
.dot{width:6px;height:6px;border-radius:50%;position:absolute;transform:translate(-50%,-50%)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
.legend span{font-size:10px;display:flex;align-items:center;gap:4px;opacity:.75}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:8px}
.cd{padding:12px;border-radius:8px;text-align:center;cursor:pointer;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);transition:all .15s}
.cd:hover{border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.06)}
.cd .cn{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;opacity:.8}
.cd .cv{font-size:18px;font-weight:700;margin-top:3px}
.cd .cs{font-size:10px;opacity:.6;margin-top:3px}
.cd.a{border-color:#2563eb;background:rgba(37,99,235,.15)}
.det{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:14px;margin-top:10px}
.stb{display:flex;gap:4px;margin-bottom:10px}
.st2{padding:5px 12px;border-radius:4px;font-size:11px;cursor:pointer;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:#94a3b8;user-select:none;transition:all .15s}
.st2:hover{background:rgba(255,255,255,.1);color:#e2e8f0}
.st2.a{background:#1d4ed8;border-color:#2563eb;color:#fff}
.st2{table-layout:fixed}.st2 th:first-child,.st2 td:first-child{width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.st2 th:nth-child(2),.st2 td:nth-child(2){width:35%;white-space:nowrap}.st2 th:nth-child(3),.st2 td:nth-child(3){width:15%;white-space:nowrap}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 10px;text-align:left;font-size:12px;border-bottom:1px solid rgba(255,255,255,.05);color:#e2e8f0}
th{font-weight:600;opacity:.6;font-size:11px;text-transform:uppercase;border-bottom-color:rgba(255,255,255,.1)}
.r{text-align:right}
.exp{cursor:pointer;padding:8px 10px;border-radius:6px;transition:background .15s}
.exp:hover{background:rgba(255,255,255,.05)}
.exp td:first-child::before{content:'\25B6 ';font-size:9px;opacity:.5;margin-right:4px}
.sub{display:none}
.sub td{padding-left:28px;opacity:.75;font-size:11px}
.bottom-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.ciclo-section{margin-bottom:20px}
.bm{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:4px;padding:5px 14px;font-size:11px;color:#e2e8f0;cursor:pointer;margin-top:8px;display:inline-block;transition:all .15s}
.bm:hover{background:rgba(255,255,255,.12)}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.bottom-grid{grid-template-columns:1fr}}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.cr{grid-template-columns:1fr}.g3,.g4{grid-template-columns:repeat(2,1fr)}.bottom-grid{grid-template-columns:1fr}}
details summary.st{cursor:pointer;user-select:none}
details summary.st::marker{content:''}
details summary.st::before{content:'\25B6 ';font-size:10px;margin-right:6px;display:inline-block;transition:transform .2s}
details[open] summary.st::before{transform:rotate(90deg)}

.d>.sec{margin-bottom:16px}
.d>.bottom-grid{margin-bottom:16px}
.d>.cr{margin-bottom:20px}
.ciclo-section{margin-bottom:20px}
</style>
</head>

function makeLine(datasets,labels){

    var x=40+i*(650/(labels.length-1));

}
