<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>MAGNUM IMPORT — Dashboard Gerencial</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a1628;color:#fff;font-family:'Segoe UI',system-ui,sans-serif;font-size:14px}
.d{max-width:1200px;margin:0 auto;padding:20px}
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:8px}
.hdr h1{font-size:22px;font-weight:700;letter-spacing:1px}
.hdr .dt{opacity:.7;font-size:13px}
.tabs{display:flex;gap:4px;margin-bottom:20px;flex-wrap:wrap}
.tb{padding:7px 16px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);color:#fff;user-select:none}
.tb:hover{background:rgba(255,255,255,.15)}
.tb.a{background:#2563eb;border-color:#2563eb}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:20px}
.kp{padding:18px;border-radius:10px}
.kp .lb{font-size:11px;text-transform:uppercase;letter-spacing:1px;opacity:.85;margin-bottom:6px}
.kp .vl{font-size:22px;font-weight:700}
.kp .sb{font-size:11px;opacity:.7;margin-top:6px}
.k1{background:linear-gradient(135deg,#1e40af,#2563eb)}
.k2{background:linear-gradient(135deg,#991b1b,#dc2626)}
.k3{background:linear-gradient(135deg,#166534,#16a34a)}
.k4{background:linear-gradient(135deg,#92400e,#d97706)}
.k5{background:linear-gradient(135deg,#4c1d95,#7c3aed)}
.k6{background:linear-gradient(135deg,#065f46,#059669)}
.sec{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:18px;margin-bottom:16px}
.st{font-size:16px;font-weight:700;margin-bottom:14px}
.cr{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.cb{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:16px}
.cb h3{font-size:13px;font-weight:600;margin-bottom:12px}
.bar-chart{display:flex;align-items:flex-end;gap:2px;height:180px;padding-top:10px}
.bar-group{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.bar-stack{display:flex;align-items:flex-end;gap:1px;height:160px}
.bar{min-width:12px;border-radius:2px 2px 0 0;position:relative}
.bar .bt{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:8px;white-space:nowrap;opacity:.8}
.bar-label{font-size:9px;opacity:.6;margin-top:4px;text-align:center}
.line-chart{position:relative;height:180px;border-left:1px solid rgba(255,255,255,.1);border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:20px}
.line-row{display:flex;align-items:flex-end;height:160px;padding:0 4px;gap:2px;position:relative}
.line-labels{display:flex;gap:2px;padding:0 4px}
.line-labels span{flex:1;text-align:center;font-size:9px;opacity:.5}
.dot{width:6px;height:6px;border-radius:50%;position:absolute}
.legend{display:flex;gap:16px;margin-bottom:8px;font-size:11px}
.legend span{display:flex;align-items:center;gap:4px}
.legend .lc{width:12px;height:3px;border-radius:2px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cd{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:12px;cursor:pointer;user-select:none}
.cd:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25)}
.cd .cn{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;opacity:.8}
.cd .cv{font-size:18px;font-weight:700;margin-top:3px}
.cd .cs{font-size:10px;opacity:.6;margin-top:3px}
.cd.a{border-color:#2563eb;background:rgba(37,99,235,.15)}
.det{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:14px;margin-top:10px}
.stb{display:flex;gap:4px;margin-bottom:10px}
.st2{padding:5px 12px;border-radius:4px;font-size:11px;cursor:pointer;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);color:#fff;user-select:none}
.st2.a{background:#2563eb;border-color:#2563eb}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 10px;text-align:left;font-size:12px;border-bottom:1px solid rgba(255,255,255,.06);color:#fff}
th{font-weight:600;opacity:.7;font-size:11px;text-transform:uppercase;border-bottom-color:rgba(255,255,255,.12)}
.r{text-align:right}
.exp{cursor:pointer;padding:8px 0;user-select:none}
.exp:hover{opacity:.85}
.aw{display:inline-block;font-size:10px;margin-right:6px}
.aw.o{transform:rotate(90deg)}
.ch{display:inline-block;padding:5px 12px;border-radius:4px;font-size:11px;cursor:pointer;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);margin:2px;color:#fff;user-select:none}
.ch:hover{background:rgba(255,255,255,.15)}
.ch.a{background:#2563eb;border-color:#2563eb}
.bm{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:4px;padding:5px 14px;font-size:11px;color:#fff;cursor:pointer;margin-top:8px;display:inline-block}
.bm:hover{background:rgba(255,255,255,.15)}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.cr{grid-template-columns:1fr}.g3,.g4{grid-template-columns:repeat(2,1fr)}}

details summary.st{cursor:pointer;user-select:none}
details summary.st::marker{content:''}
details summary.st::before{content:'\25B6 ';font-size:10px;margin-right:6px;display:inline-block;transition:transform .2s}
details[open] summary.st::before{transform:rotate(90deg)}
</style>
</head>

function makeBar(values,colors,max,labels){
  var h='<div class="bar-chart">';
  for(var i=0;i<labels.length;i++){
    h+='<div class="bar-group"><div class="bar-stack">';
    for(var j=0;j<values.length;j++){
      var v=values[j][i]||0;
      var pct=max>0?Math.max(v/max*150,1):1;
      var showLabel=true;
      h+='<div class="bar" style="height:'+pct+'px;width:'+(values.length>1?Math.floor(40/values.length):30)+'px;background:'+colors[j]+'">';
      if(v>0&&showLabel)h+='<div class="bt">'+fmt(v)+'</div>';
      h+='</div>';
    }
    h+='</div><div class="bar-label">'+labels[i]+'</div></div>';
  }
  return h+'</div>';
}

function makeLine(datasets,labels){
  var allVals=[];
  datasets.forEach(function(ds){ds.data.forEach(function(v){if(v!==null)allVals.push(v)})});
  var mx=Math.max.apply(null,allVals);
  var h='<div class="legend">';
  datasets.forEach(function(ds){h+='<span><span class="lc" style="background:'+ds.color+'"></span>'+ds.label+'</span>'});
  h+='</div>';
  h+='<svg viewBox="0 0 700 200" style="width:100%;height:200px">';
  // Grid lines
  for(var g=0;g<5;g++){
    var gy=180-g*40;
    h+='<line x1="30" y1="'+gy+'" x2="690" y2="'+gy+'" stroke="rgba(255,255,255,.06)" />';
    h+='<text x="0" y="'+(gy+4)+'" fill="rgba(255,255,255,.4)" font-size="9">'+fmt(mx/4*g)+'</text>';
  }
  // X labels
  for(var i=0;i<labels.length;i++){
    var x=40+i*(650/(labels.length-1));
    h+='<text x="'+x+'" y="198" fill="rgba(255,255,255,.4)" font-size="9" text-anchor="middle">'+labels[i]+'</text>';
  }
  // Lines
  datasets.forEach(function(ds){
    var pts=[];
    for(var i=0;i<ds.data.length;i++){
      if(ds.data[i]===null)continue;
      var x=40+i*(650/(labels.length-1));
      var y=180-(ds.data[i]/mx*160);
      pts.push(x+','+y);
    }
    if(pts.length>1)h+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+ds.color+'" stroke-width="'+(ds.bold?2.5:1.5)+'" />';
    pts.forEach(function(p){var xy=p.split(',');h+='<circle cx="'+xy[0]+'" cy="'+xy[1]+'" r="'+(ds.bold?3:2)+'" fill="'+ds.color+'" />'});
  });
  h+='</svg>';
  return h;
}

  if(iA.length>half){h+='<div class="g3">';iA.slice(half).forEach(function(e){h+='<div class="cd'+(sIU===e[0]?' a':'')+'" onclick="toggleIU(\''+e[0]+'\')"><div class="cn">'+(U[e[0]]||e[0])+'</div><div class="cv">'+fmt(e[1])+'</div><div class="cs">inadimplente</div></div>'});h+='</div>'}
  if(sIU&&ID[sIU]){h+='<div class="det"><table><tr><th>Devedor</th><th class="r">Valor</th></tr>';ID[sIU].forEach(function(d){h+='<tr><td>'+d.n+'</td><td class="r">'+fF(d.v)+'</td></tr>'});h+='</table></div>'}
  h+='</div>';

  // DESPESAS
  h+='<div class="sec"><div class="st">Despesas por Subsetor</div>';
  h+='<div style="margin-bottom:10px">';
  h+='<span class="ch'+(sDU==='ALL'?' a':'')+'" onclick="setDU(\'ALL\')">Todas</span>';
  ['RS','TRAUMATO','HOLEP','SP','PR','SC','BA'].forEach(function(u){h+='<span class="ch'+(sDU===u?' a':'')+'" onclick="setDU(\''+u+'\')">'+(U[u]||u)+'</span>'});
  h+='</div>';
  var dtot=sDU==='ALL'?gv(DM,sM):(sM===0?(DU[sDU]||0):guv(DUM,sDU,sM));
  h+='<div style="font-size:13px;margin-bottom:8px;opacity:.7">Total: '+fF(dtot)+'</div>';
  var dsData;
  if(sDU==='ALL'){dsData=sM===0?DS:(DSM[sM]||[])}
  else{dsData=sM===0?(DSU[sDU]||[]):((DSUM[sDU]&&DSUM[sDU][sM])||[])}
  var sc=dExp?dsData.length:10;
  h+='<table><tr><th>Subsetor</th><th class="r">Valor</th><th class="r">%</th></tr>';
  var ddLookup;
  if(sDU==='ALL'){ddLookup=sM===0?DSD:(DSDM[sM]||{})}
  else{ddLookup=sM===0?(DSDU[sDU]||{}):((DSDUM[sDU]&&DSDUM[sDU][sM])||{})}
  dsData.slice(0,sc).forEach(function(d){
    var p=dtot>0?(d.v/dtot*100).toFixed(1):'0';
    var isOpen=xDS===d.n;
    h+='<tr style="cursor:pointer" onclick="toggleDS(\''+d.n.replace(/'/g,"\\'")+'\')">';
    h+='<td>'+(isOpen?'▼ ':'▶ ')+d.n+'</td><td class="r">'+fF(d.v)+'</td><td class="r">'+p+'%</td></tr>';
    if(isOpen){
      var det=ddLookup[d.n]||[];
      det.forEach(function(dd){
        var isNOpen=xDN===dd.n;
        if(dd.o){
        h+='<tr style="cursor:pointer;background:rgba(255,255,255,.03)" onclick="event.stopPropagation();toggleDN(\''+dd.n.replace(/'/g,"\\\'")+'\')"><td style="padding-left:24px;font-size:12px">'+(isNOpen?'\u25bc ':'\u25b6 ')+dd.n+'</td><td class="r" style="font-size:12px">'+fF(dd.v)+'</td><td class="r"></td></tr>';
        }else{
        h+='<tr style="background:rgba(255,255,255,.03)"><td style="padding-left:36px;font-size:12px">'+dd.n+'</td><td class="r" style="font-size:12px">'+fF(dd.v)+'</td><td class="r"></td></tr>';
        }
        if(isNOpen&&dd.o){
          h+='<tr style="background:rgba(255,255,255,.02)"><td colspan="3" style="padding-left:40px;font-size:11px;opacity:.7;white-space:pre-wrap">'+dd.o+'</td></tr>';
        }
      });
    }
  });
  h+='</table>';
  if(dsData.length>10)h+='<div class="bm" onclick="toggleDE()">'+(dExp?'Ver menos':'Ver mais ('+dsData.length+')')+'</div>';
  h+='</div>';

  // SALDO
  h+='<div class="sec"><div class="st">Saldo Bancário</div>';
  var sU=["BA","HOLEP","PR","RS","SC","SP","TRAUMATO","XP"];
  var tCC=0,tI=0;sU.forEach(function(u){tCC+=(SB[u].cc||0);tI+=(SB[u].inv||0)});
  h+='<div style="margin-bottom:12px;font-size:13px">CC: <b>'+fF(tCC)+'</b> &nbsp;|&nbsp; Investimentos: <b>'+fF(tI)+'</b> &nbsp;|&nbsp; Coloplast: <b style="color:#e74c3c">-'+fF(COLOPLAST)+'</b> &nbsp;|&nbsp; Total: <b>'+fF(tCC+tI-COLOPLAST)+'</b></div>';
  function sbCard(u){
    var s=SB[u],open=sSU===u,tot=s.cc+(s.inv||0);
    var c='<div class="cd'+(open?' a':'')+'" onclick="toggleSU(\''+u+'\')" style="'+(open?'padding-bottom:14px':'')+'">';
    c+='<div class="cn">'+(U[u]||u)+'</div>';
    c+='<div class="cv">'+fmt(tot)+'</div>';
    c+='<div class="cs">Total em '+s.d+'</div>';
    if(open){
      c+='<div style="margin-top:10px;padding-top:8px;border-top:1px solid rgba(255,255,255,.15);font-size:12px">';
      c+='<div style="opacity:.7;margin-bottom:4px">Banco: <b>'+s.fd+'</b></div>';
      c+='<div>CC: <b>'+fF(s.cc)+'</b></div>';
      if(s.inv>0){
        c+='<div style="margin-top:6px">Investimentos: <b>'+fF(s.inv)+'</b></div>';
        if(INV[u]){
          var tr=0;INV[u].forEach(function(i){tr+=i.r});
          c+='<div style="opacity:.7;margin-top:2px">Rendimento total: <b style="color:#22c55e">'+fF(tr)+'</b></div>';
          c+='<table style="margin-top:6px;font-size:11px"><tr><th style="padding:4px 6px">Ativo</th><th class="r" style="padding:4px 6px">Principal</th><th class="r" style="padding:4px 6px">Rend.</th><th class="r" style="padding:4px 6px">Líquido</th></tr>';
          INV[u].forEach(function(i){c+='<tr><td style="padding:4px 6px">'+i.n+'</td><td class="r" style="padding:4px 6px">'+fF(i.p)+'</td><td class="r" style="padding:4px 6px;color:#22c55e">'+fF(i.r)+'</td><td class="r" style="padding:4px 6px">'+fF(i.sl)+'</td></tr>'});
          c+='</table>';
        }
      }
      c+='</div>';
    }
    c+='</div>';
    return c;
  }
  h+='<div class="g3" style="margin-bottom:8px">';
  sU.slice(0,3).forEach(function(u){h+=sbCard(u)});
  h+='</div><div class="g3">';
  sU.slice(3).forEach(function(u){h+=sbCard(u)});
  h+='</div>';
  h+='</div>';

  document.getElementById('app').innerHTML=h;window.scrollTo(0,_sp);

}

window.setSM=function(v){sM=v;render()};
window.toggleCU=function(u){sCU=sCU===u?null:u;render()};
window.setSCT=function(t){sCT=t;render()};
window.toggleIU=function(u){sIU=sIU===u?null:u;render()};
window.setDU=function(u){sDU=u;render()};
window.toggleDE=function(){dExp=!dExp;render()};
window.toggleDS=function(sub){if(xDS===sub){xDS=null;xDN=null}else{xDS=sub;xDN=null}render()};
window.toggleDN=function(nome){xDN=xDN===nome?null:nome;render()};
  window.toggleSU=function(u){sSU=sSU===u?null:u;render()};
  window.toggleVO=function(k){vO[k]=!vO[k];render()};

render();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                     </script>
